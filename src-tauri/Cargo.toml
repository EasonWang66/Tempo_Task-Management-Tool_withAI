[package]
name = "tempo"
version = "0.1.0"
description = "Local-first AI task planner"
authors = ["Tempo"]
edition = "2021"
[lib]
name = "tempo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
[build-dependencies]
tauri-build = { version = "2", features = [] }
[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
